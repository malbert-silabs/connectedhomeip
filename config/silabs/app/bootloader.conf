# Configuration overlay applied to the MCUboot bootloader build
# (config/silabs/app/zephyr-post-build.cmake).

# Signature verification. The Silabs tree uses PSA/tf-psa-crypto (ECDSA P256);
# the MCUboot default (RSA + legacy mbedTLS SHA256) does not link here, so select
# ECDSA P256 explicitly. This must match the algorithm of the key the application
# is signed with (CONFIG_MCUBOOT_SIGNATURE_KEY_FILE in the app's prj_ota.conf).
#
# Selecting ECDSA P256 also makes the Silabs Zephyr build sign the MCUboot image
# with Simplicity Commander (zephyr-silabs commander_sign.cmake), which uses
# CONFIG_BOOT_SIGNATURE_KEY_FILE as the --keyfile resolved from the bootloader
# build directory. CONFIG_BOOT_SIGNATURE_KEY_FILE is therefore supplied as an
# absolute path by config/silabs/app/zephyr-post-build.cmake (a relative path
# would not resolve from that directory); do not set it here.
CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y

# Embed the public key in the bootloader instead of using a built-in (Secure
# Vault) key. With the Silabs HSE PSA driver enabled, MCUboot defaults
# CONFIG_BOOT_BUILTIN_KEY=y (boot/zephyr/Kconfig: "default y if
# PSA_CRYPTO_DRIVER_SILABS_HSE"), which makes it verify against a key that must
# be provisioned into the device key store under CONFIG_BOOT_BUILTIN_KEY_ID
# (0x7fff0001) beforehand -- not the key compiled from
# CONFIG_BOOT_SIGNATURE_KEY_FILE. Without that provisioning step every image is
# rejected ("Image in the primary slot is not valid!"). Disabling it makes the
# build generate autogen-pubkey.c from CONFIG_BOOT_SIGNATURE_KEY_FILE and embed
# it, so validation matches `west sign`/imgtool with the same key and needs no
# Secure Vault provisioning. Production devices should instead provision the key
# hash into Secure Vault and drop this override.
CONFIG_BOOT_BUILTIN_KEY=n

# Overwrite-only install: the secondary slot (slot1) lives on the external SPI
# NOR and the primary (slot0) on internal flash, so the slots cannot be swapped;
# MCUboot copies the secondary over the primary and there is no revert. This also
# matches the future compressed-image path (a compressed image cannot be swapped).
CONFIG_BOOT_UPGRADE_ONLY=y

# Let MCUboot reach the external SPI NOR that holds the secondary slot. The
# bootloader build receives the application's DT overlays (zephyr-post-build.cmake),
# so it sees slot1 on the mx25r80 (jedec,spi-nor) node behind EUSART1.
CONFIG_SPI=y
CONFIG_SPI_SILABS_EUSART=y
CONFIG_SPI_NOR=y

# Note: BOOT_MAX_IMG_SECTORS is computed automatically (BOOT_MAX_IMG_SECTORS_AUTO
# is enabled by default in this MCUboot fork), which correctly covers both the
# internal 8 kB-page primary and the external 4 kB-sector secondary. Setting it
# explicitly is rejected with a warning, so it is intentionally omitted.
