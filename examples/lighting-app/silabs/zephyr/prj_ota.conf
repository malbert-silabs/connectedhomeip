# Options needed for OTA are located on this file
# This file should contain only options specific for this sample
# or overrides the default ones.

CONFIG_CHIP_OTA_REQUESTOR=y

# ==============================================================================
# Interim external-SPI OTA layout (see boards/xg24_rb4187c.overlay)
# ==============================================================================
# Enabling CHIP_OTA_REQUESTOR implies CONFIG_BOOTLOADER_MCUBOOT (config/silabs/Kconfig)
# and sets CONFIG_UPDATEABLE_IMAGE_NUMBER=1 for single-application-image OTA. The
# app is linked into the MCUboot primary slot (slot0, internal flash). The
# downloaded image is streamed into the secondary slot (slot1), which the board
# overlay places on the onboard MX25R external SPI NOR (full uncompressed image).
# MCUboot then installs it into slot0 in overwrite-only mode
# (config/silabs/app/bootloader.conf).
#
# This is temporary: once the Silabs MCUboot fork gains an LZMA decompression
# engine, move slot1 back to a smaller internal compressed secondary and drop the
# external SPI dependency. See README.md.
#
# MCUboot requires slot0 and slot1 to be the same size, and the external MX25R
# caps the secondary at 1 MiB, so both slots are 1024 kB. The *signed* image must
# therefore stay under 1024 kB (it is ~978 kB today -- a tight ~46 kB of
# headroom). If it grows past ~1 MB the build will fail to fit slot0; disable the
# shell or lower logging (CONFIG_LOG_DEFAULT_LEVEL) to recover space.

# Drivers required to read/write the external SPI NOR that holds slot1. The
# mx25r80 node (jedec,spi-nor) sits on EUSART1 (silabs,eusart-spi). CONFIG_SPI_NOR
# defaults to y for the enabled jedec,spi-nor node but is listed explicitly.
CONFIG_SPI=y
CONFIG_SPI_SILABS_EUSART=y
CONFIG_SPI_NOR=y

# Sign the application image so MCUboot accepts it. The Silabs bootloader is built
# for ECDSA P256 (config/silabs/app/bootloader.conf); `west sign -t imgtool` infers
# the ECDSA algorithm from this EC P256 key. Replace with a production key as
# needed. Path is relative to the west workspace topdir.
CONFIG_MCUBOOT_SIGNATURE_KEY_FILE="bootloader/mcuboot/root-ec-p256.pem"
# Match the bootloader's overwrite-only mode when computing image padding/overflow.
CONFIG_MCUBOOT_IMGTOOL_OVERWRITE_ONLY=y

# Matter software version advertised by the device. The OTA *update* image must be
# built with a higher value than the running image, e.g. add
#   -DCONFIG_CHIP_DEVICE_SOFTWARE_VERSION=2
#   -DCONFIG_CHIP_DEVICE_SOFTWARE_VERSION_STRING="2.0"
# to the west build of the update. Leave the base build at 1.
CONFIG_CHIP_DEVICE_SOFTWARE_VERSION=1
CONFIG_CHIP_DEVICE_SOFTWARE_VERSION_STRING="1.0"
